<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex, nofollow">
<title>Família Saudável</title>
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥦</text></svg>">
</head>
<body>

<div id="login" class="login oculto">
  <div class="login-caixa">
    <div class="login-logo">🥦</div>
    <h1>Família Saudável</h1>
    <p class="mudo">Entre com o e-mail e a senha da família.</p>
    <form id="form-login">
      <label>E-mail<input type="email" id="login-email" autocomplete="username" required></label>
      <label>Senha<input type="password" id="login-senha" autocomplete="current-password" required></label>
      <button type="submit" class="btn primario largo">Entrar</button>
      <p id="login-erro" class="erro"></p>
    </form>
  </div>
</div>

<header class="topo">
  <div class="topo-linha">
    <div>
      <div class="marca">🥦 Família Saudável</div>
      <div id="topo-data" class="topo-data"></div>
    </div>
    <div class="topo-dir">
      <span id="sync" class="sync" title="Situação dos dados"></span>
      <button id="btn-editar" class="btn-icone" data-acao="modo-editar" aria-label="Modo edição">✏️</button>
      <button id="btn-sair" class="btn-icone oculto" aria-label="Sair">⎋</button>
    </div>
  </div>
  <nav id="abas" class="abas" aria-label="Abas"></nav>
</header>

<main id="conteudo" class="conteudo"></main>
<nav id="nav" class="nav-baixo" aria-label="Seções"></nav>

<div id="modal" class="modal oculto" role="dialog" aria-modal="true">
  <div class="modal-caixa">
    <button class="modal-fechar" id="modal-fechar" aria-label="Fechar">✕</button>
    <div id="modal-corpo"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="dados.js"></script>
<script src="figuras.js"></script>
<script src="app.js"></script>
<script src="criancas.js"></script>
<script src="provas.js"></script>
<script src="relogio.js"></script>
<script src="editor.js"></script>
<script>App.iniciar();</script>
</body>
</html>
